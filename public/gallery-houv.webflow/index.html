  <script>
// This is for the about open and close toggle
document.addEventListener('DOMContentLoaded', () => {
    const aboutLink = document.querySelector('.about-link');
    const aboutWrap = document.querySelector('.about_wrap');
    const aboutComponent = aboutWrap.querySelector('.about_component');
    const aboutText = aboutComponent.querySelector('.about_text');
    const imageCollection = document.querySelector('.image-collection');
    const filterLink = document.querySelector('.filter-link');
    let isAboutOpen = false;
    function toggleAboutSection() {
        if (!isAboutOpen) {
            aboutLink.textContent = '[CLOSE]';
            // Reset aboutText opacity to 1 to ensure it is visible
            gsap.set(aboutText, { opacity: 1 });
            // Create a timeline for synchronized animations
            const tl = gsap.timeline();
            tl.to(imageCollection, {
                    scale: 0.8,
                    opacity: 0.3,
                    filter: 'blur(5px)',
                    duration: 0.8,
                    ease: "power3.out"
                })
                .to(filterLink, { 
                    opacity: 0, 
                    duration: 0.5, 
                    ease: "power3.out" 
                }, '-=0.8') // Synchronize with imageCollection animation
                .set(aboutWrap, { display: 'flex' })
                .to(aboutWrap, { opacity: 1, duration: 0.5 });
            // Animate the about_text word by word within the same timeline
            const text = new SplitType(aboutText, { types: 'words' });
            tl.from(text.words, {
                opacity: 0,
                y: 0,
                duration: 1.5,
                stagger: {
                    amount: 1, // Total duration of the stagger
                    from: 'random' // Stagger from a random order
                },
                ease: 'power2.out'
            }, '-=1'); // Synchronize with the other animations
        } else {
            aboutLink.textContent = '[ABOUT]';
            // Fade out about_text without resetting innerHTML
            gsap.to(aboutText, { opacity: 0, duration: 0.5 });
            // Scale back up the image collection, remove blur, fade, and show the filter link
            gsap.timeline()
                .to(aboutWrap, { opacity: 0, duration: 0.5 })
                .to(imageCollection, {
                    scale: 1,
                    opacity: 1,
                    filter: 'blur(0px)',
                    duration: 0.8,
                    ease: "power3.out"
                })
                .to(filterLink, { 
                    opacity: 1, 
                    duration: 0.5, 
                    ease: "power3.out" 
                }, '-=0.8')
                .set(aboutWrap, { display: 'none' }); // Set display: none at the very end
        }
        isAboutOpen = !isAboutOpen;
    }
    // Event listener for the about link
    aboutLink.addEventListener('click', toggleAboutSection);
});
</script>
  <script>
// This is for the text animation using split text
  const lettersAndSymbols = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'l', 'm', 'n', 'o', 'p', 'q', 'r', 's', 't', 'u', 'v', 'w', 'x', 'y', 'z', '!', '@', '#', '$', '%', '^', '&', '*', '-', '_', '+', '=', ';', ':', '<', '>', ','];
  class TextSplitter {
    constructor(element, options) {
      this.element = element;
      this.options = options;
      this.chars = this.split();
    }
    split() {
      const { splitTypeTypes } = this.options;
      let splitChars = [];
      if (splitTypeTypes.includes('words')) {
        const words = this.element.innerText.split(' ');
        this.element.innerHTML = words.map(word => `<span class="word">${word}</span>`).join(' ');
        splitChars = Array.from(this.element.querySelectorAll('.word'));
      }
      if (splitTypeTypes.includes('chars')) {
        splitChars = splitChars.flatMap(word => {
          const chars = word.innerText.split('').map(char => `<span class="char">${char}</span>`).join('');
          word.innerHTML = chars;
          return Array.from(word.querySelectorAll('.char'));
        });
      }
      return splitChars;
    }
    getChars() {
      return this.chars;
    }
  }
  class TextAnimator {
    constructor(textElement) {
      if (!textElement || !(textElement instanceof HTMLElement)) {
        throw new Error('Invalid text element provided.');
      }
      this.textElement = textElement;
      this.splitText();
    }
    splitText() {
      this.splitter = new TextSplitter(this.textElement, {
        splitTypeTypes: 'words, chars'
      });
      gsap.set(this.splitter.getChars(), { opacity: 0 });
      this.originalChars = this.splitter.getChars().map(char => char.innerHTML);
    }
    animate() {
      const chars = this.splitter.getChars();
      chars.forEach((char, position) => {
        let initialHTML = char.innerHTML;
        let repeatCount = 0;
        gsap.fromTo(char, 
        {
          opacity: 0
        }, 
        {
          opacity: 1,
          duration: 0.03,
          onStart: () => {
            gsap.set(char, { '--opa': 1 });
          },
          onComplete: () => {
            gsap.set(char, { innerHTML: initialHTML });
          },
          repeat: 3,
          onRepeat: () => {
            repeatCount++;
            if (repeatCount === 1) {
              gsap.set(char, { '--opa': 0 });
            }
          },
          repeatRefresh: true,

  <script>
// This is for the loading animation 
document.addEventListener('DOMContentLoaded', () => {
    const loadingWrap = document.querySelector('.loading_wrap');
    const loadingWordText = loadingWrap.querySelector('.loading-word_text');
    const navbarWrap = document.querySelector('.navbar_wrap');
    const filterWrap = document.querySelector('.filter_wrap');
    const cursor = document.querySelector('.cursor'); // Select the cursor element
    const canvasItems = document.querySelectorAll('.canvas__item');
    // Set the opacity of the loading-word_text to 100% immediately
    gsap.set(loadingWordText, { opacity: 1 });
    // TextAnimator class with spaces preserved
    class TextAnimator {
        constructor(textElement) {
            this.textElement = textElement;
            this.splitText();
        }
        splitText() {
            this.textElement.innerHTML = this.textElement.textContent.replace(/(\S|\s)/g, match => {
                return match === " " ? "<span class='letter'>&nbsp;</span>" : `<span class='letter'>${match}</span>`;
            });
            this.chars = this.textElement.querySelectorAll('.letter');
        }
        animate() {
            gsap.fromTo(this.chars, 
                { opacity: 0, y: "100%" }, 
                { opacity: 1, y: "0%", duration: 0.03, stagger: 0.07, ease: "power2.out" }
            );
        }
        reset() {
            gsap.set(this.chars, { opacity: 0, y: "100%" });
        }
    }
    // Initialize text animation for the loading text
    const loadingTextAnimator = new TextAnimator(loadingWordText);
    // Function to handle loading animation
    function runLoadingAnimation() {
        // Start with navbar, filter wrap, and cursor hidden
        gsap.set([navbarWrap, filterWrap, cursor], { opacity: 0, filter: 'blur(5px)', pointerEvents: 'none' });
        // Play the loading text animation
        loadingTextAnimator.animate();
        // After text animation completes, animate the canvas items
        gsap.timeline({ delay: 1.5 }) // Delay to match the end of the text animation
            .fromTo(canvasItems, 
                { y: 150, opacity: 0, filter: 'blur(5px)', scale: 0.9 }, 
                { y: 0, opacity: 1, filter: 'blur(0px)', scale: 1, duration: 1, ease: "power3.out", stagger: 0.3 }
            )
            .to([navbarWrap, filterWrap, cursor], 
                { opacity: 1, filter: 'blur(0px)', duration: 0.5, pointerEvents: 'auto', ease: "power3.out" }
            )
            .to(loadingWrap, 
                { opacity: 0, duration: 0.5, onComplete: () => loadingWrap.style.display = 'none' }
            ); // Hide the loading wrap after the animation
    }
    // Run the loading animation when the page is ready
    runLoadingAnimation();
});
</script>
  <script>
const canvasItems = document.querySelectorAll('.canvas__item');
function toggleImageSize(event) {
  const canvasItem = event.currentTarget;
  const imgWrap = canvasItem.querySelector('.project_image-wrap');
  const isEnlarged = canvasItem.getAttribute('data-enlarged') === 'true';
  const originalPosition = JSON.parse(canvasItem.getAttribute('data-original-position'));
  const viewportWidth = window.innerWidth;
  const viewportHeight = window.innerHeight;
  if (!isEnlarged) {
    // Dynamic sizing to scale on mobile while keeping aspect ratio
    const enlargedWidth = Math.min(500, viewportWidth * 0.9);  
    const enlargedHeight = enlargedWidth * 1.2; // 1.2 is the 600/500 aspect ratio
    const centeredLeft = (viewportWidth - enlargedWidth) / 2;
    const centeredTop = (viewportHeight - enlargedHeight) / 2;
    gsap.to(canvasItem, {
      zIndex: 1000,
      top: centeredTop + window.scrollY + 'px',
      left: centeredLeft + window.scrollX + 'px',
      ease: 'power4.out',
      duration: 1
    });
    gsap.to(imgWrap, {
      width: enlargedWidth + 'px',
      height: enlargedHeight + 'px',
      ease: 'power4.out',
      duration: 1,
      delay: 0
    });
    canvasItems.forEach(item => {
      if (item !== canvasItem) {
        gsap.to(item, {
          scale: 0.8,
          pointerEvents: 'none',
          ease: 'power4.out',
          duration: 1
        });
        applyBlurEffect(item);
      }
    });
    canvasItem.setAttribute('data-enlarged', 'true');
  } else {
    gsap.to(canvasItem, {
      zIndex: 1,
      top: originalPosition.top,
      left: originalPosition.left,
      ease: 'power4.out',
      duration: 1
    });
    gsap.to(imgWrap, {
      width: originalPosition.width,
      height: originalPosition.height,
      ease: 'power4.out',
      duration: 1,
      delay: 0
    });
    canvasItems.forEach(item => {
      if (item !== canvasItem) {
        gsap.to(item, {
          scale: 1,
          pointerEvents: filterActive && !item.getAttribute('data-filter').includes(selectedYear) ? 'none' : 'auto',
          ease: 'power4.out',
          duration: 1
        });
        removeBlurEffect(item);
      }
    });
    canvasItem.setAttribute('data-enlarged', 'false');
  }
}
function applyBlurEffect(item) {
  gsap.to(item.querySelector('.project_image-wrap'), {
    filter: 'blur(10px)',
    duration: 1,
    ease: 'power4.out'
  });
}
function removeBlurEffect(item) {
  gsap.to(item.querySelector('.project_image-wrap'), {
    filter: 'blur(0px)',
    duration: 1,
    ease: 'power4.out'
  });
}
canvasItems.forEach((item) => {
  const imgWrap = item.querySelector('.project_image-wrap');
  const position = item.getBoundingClientRect();
  const originalPosition = {
    top: position.top + window.scrollY + 'px',
    left: position.left + window.scrollX + 'px',
    width: imgWrap.offsetWidth + 'px',
    height: imgWrap.offsetHeight + 'px'
  };
  item.style.top = originalPosition.top;
  item.style.left = originalPosition.left;
  item.setAttribute('data-original-position', JSON.stringify(originalPosition));
  item.setAttribute('data-enlarged', 'false');
  item.addEventListener('click', toggleImageSize);
});
let filterActive = false;
let selectedYear = '';
const revealFilterLinks = () => {
  const filterLinks = document.querySelectorAll('.filter-link-year');
  gsap.to(filterLinks, {
    opacity: 1,
    filter: 'blur(0px)',
    x: 0,
    pointerEvents: 'auto',
    duration: 0.5,
    stagger: 0.1,
    ease: 'power2.out'
  });
};
const hideFilterLinks = () => {
  const filterLinks = document.querySelectorAll('.filter-link-year');
  gsap.to(filterLinks, {
    opacity: 0,
    filter: 'blur(5px)',
    x: 100,
    pointerEvents: 'none',
    duration: 0.5,
    stagger: 0.1,
    ease: 'power2.in'
  });
};
const revertCanvasItems = () => {
  gsap.to(canvasItems, {
    scale: 1,
    opacity: 1,
    pointerEvents: 'auto',
    filter: 'blur(0px)',
    duration: 0.5,
    ease: 'power2.out',
    stagger: 0.1
  });
};
const filterProjectsByYear = (year) => {
  selectedYear = year;
  const projects = document.querySelectorAll('.canvas__item');
  projects.forEach(project => {
    const projectYear = project.getAttribute('data-filter');
    const projectImage = project.querySelector('.project_image-wrap');
    if (projectYear.includes(year)) {
      gsap.to(project, {
        opacity: 1,
        filter: 'blur(0px)',
        scale: 1.1,
        pointerEvents: 'auto',
        duration: 0.5,
        ease: 'power2.out',
        transformOrigin: "center center"
      });
    } else {
      gsap.to(project, {
        opacity: 0.3,
        filter: 'blur(5px)',
        scale: 0.9,
        pointerEvents: 'none',
        duration: 0.5,
        ease: 'power2.out',
        stagger: { each: 0.1 }
      });
    }
  });
};
const init = () => {
  const filterLink = document.querySelector('.filter-link');
  if (filterLink) {
    filterLink.addEventListener('click', (event) => {
      event.preventDefault();
      if (!filterActive) {
        revealFilterLinks();
        filterLink.textContent = '[close]';
      } else {
        hideFilterLinks();
        filterLink.textContent = '[filter]';
        revertCanvasItems(); // Revert canvas items to original state when filter is closed
      }
      filterActive = !filterActive;
    });
  } else {
    console.error('Filter link not found');
  }
  document.querySelectorAll('.filter-link-year').forEach(link => {
    link.addEventListener('click', () => {
      const year = link.getAttribute('data-year');
      filterActive = true;
      filterProjectsByYear(year);
    });
  });
  document.querySelectorAll('.canvas__item').forEach(item => {
    const textWrap = item.querySelector('.project_text-wrap');
    const animators = Array.from(textWrap.children).map(child => new TextAnimator(child));
    const imageWrap = item.querySelector('.project_image-wrap');
    imageWrap.addEventListener('mouseenter', () => {
      const isEnlarged = document.querySelector('[data-enlarged="true"]');
      if (!filterActive && !isEnlarged) {
        const otherCanvasItems = Array.from(document.querySelectorAll('.canvas__item')).filter(otherItem => otherItem !== item);
        gsap.to(otherCanvasItems, {
          filter: 'blur(5px)',
          duration: 0.5,
          ease: 'power1.inOut'
        });
      }
      animators.forEach(animator => animator.animate());
    });
    imageWrap.addEventListener('mouseleave', () => {
      const isEnlarged = document.querySelector('[data-enlarged="true"]');
      if (!filterActive && !isEnlarged) {
        const otherCanvasItems = Array.from(document.querySelectorAll('.canvas__item')).filter(otherItem => otherItem !== item);
        gsap.to(otherCanvasItems, {
          filter: 'blur(0px)',
          duration: 0.5,
          ease: 'power1.inOut'
        });
      }
      animators.forEach(animator => animator.reset());
    });
  });
};
init();
</script>
  <script>
// Cursor Follow and Position Calculation
document.addEventListener("mousemove", (e) => {
    const cursor = document.querySelector('.cursor');
    const latitudeText = document.getElementById('latitude');
    const longitudeText = document.getElementById('longitude');
    // Update cursor position
    cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
    // Calculate latitude and longitude based on mouse position
    const latitude = ((e.clientY / window.innerHeight) * 180 - 90).toFixed(4);
    const longitude = ((e.clientX / window.innerWidth) * 360 - 180).toFixed(4);
    // Update text content
    latitudeText.textContent = `${Math.abs(latitude).toFixed(4)}°${latitude >= 0 ? 'S' : 'N'}`;
    longitudeText.textContent = `${Math.abs(longitude).toFixed(4)}°${longitude >= 0 ? 'E' : 'W'}`;
});
</script>
  <script>
const folders = document.querySelectorAll(".folder");
const folderWrappers = document.querySelectorAll(".folder-wrapper");
let isMobile = window.innerWidth < 1000;
/* Initial state */
function setInitialPositions() {
  gsap.set(folderWrappers, {
    y: isMobile ? 0 : 25,
  });
  const allPreviewImages = document.querySelectorAll(".folder-preview-img");
  gsap.set(allPreviewImages, {
    y: "0%",
    rotation: 0,
  });
}
setInitialPositions();
/*  Hover interactions  */
folders.forEach((folder, index) => {
  const previewImages = folder.querySelectorAll(".folder-preview-img");
  // MOUSE ENTER
  folder.addEventListener("mouseenter", () => {
    if (isMobile) return;
    // Disable siblings
    folders.forEach((siblingFolder) => {
      if (siblingFolder !== folder) {
        siblingFolder.classList.add("disabled");
      }
    });
    // Lift folder
    gsap.to(folderWrappers[index], {
      y: 0,
      duration: 0.25,
      ease: "back.out(1.7)",
    });
    // Animate preview images
    previewImages.forEach((img, imgIndex) => {
      let rotation;
      if (imgIndex === 0) {
        rotation = gsap.utils.random(-20, -10);
      } else if (imgIndex === 1) {
        rotation = gsap.utils.random(-10, 10);
      } else {
        rotation = gsap.utils.random(10, 20);
      }
      gsap.to(img, {
        y: "-100%",
        rotation: rotation,
        duration: 0.25,
        ease: "back.out(1.7)",
        delay: imgIndex * 0.025,
      });
    });
  });
  // MOUSE LEAVE
  folder.addEventListener("mouseleave", () => {
    if (isMobile) return;
    // Enable all folders
    folders.forEach((siblingFolder) => {
      siblingFolder.classList.remove("disabled");
    });
    // Reset folder position
    gsap.to(folderWrappers[index], {
      y: 25,
      duration: 0.25,
      ease: "back.out(1.7)",
    });
    // Reset preview images
    previewImages.forEach((img, imgIndex) => {
      gsap.to(img, {
        y: "0%",
        rotation: 0,
        duration: 0.25,
        ease: "back.out(1.7)",
        delay: imgIndex * 0.05,
      });
    });
  });
});
/* Resize handling  */
window.addEventListener("resize", () => {
  const currentBreakpoint = window.innerWidth < 1000;
  if (currentBreakpoint !== isMobile) {
    isMobile = currentBreakpoint;
    setInitialPositions();
    folders.forEach((folder) => {
      folder.classList.remove("disabled");
    });
  }
});
</script>
