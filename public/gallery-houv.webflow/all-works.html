  <script>
// Loop through EACH sticky wrapper independently
$(".sticky-wrapper").each(function () {
  let $wrapper = $(this);
  let stickyImgClass = ".sticky_img";
  // 1. Move images outside of items, scoped only to THIS wrapper
  $wrapper.find(".sticky_item").each(function () {
    let myImg = $(this).find(stickyImgClass);
    myImg.insertAfter($(this));
  });
  // 2. Target only the images inside THIS wrapper
  let $wrapperImages = $wrapper.find(stickyImgClass);
  // 3. Set the first image of THIS wrapper to 100% height
  gsap.set($wrapperImages.first(), { height: "100%" });
  // 4. Create a timeline with THIS wrapper as the trigger
  let tl = gsap.timeline({
    scrollTrigger: {
      trigger: $wrapper[0], // Target the specific DOM element
      start: "top top",
      end: "bottom bottom",
      scrub: true
    },
    defaults: {
      ease: "none"
    }
  });
  // 5. Animate only the images within THIS wrapper
  $wrapperImages.not(":last-child").each(function () {
    tl.to($(this), { height: "0%" });
    tl.to($(this).nextAll(stickyImgClass).eq(0), { height: "100%" }, "<");
  });
});
</script>
